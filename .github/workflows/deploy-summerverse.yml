name: Deploy SummerVerse AI

on:
  push:
    branches:
      - main
    paths:
      - "summerverse-ai-demo/**"
      - ".github/workflows/deploy-summerverse.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish interactive prototype
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify SummerVerse bundle
        shell: bash
        run: |
          cat summerverse-ai-demo/payload/{01..12}.txt \
            | tr -d '\r\n ' \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/SummerVerse-AI-demo.html
          actual_sha="$(sha256sum /tmp/SummerVerse-AI-demo.html | awk '{print $1}')"
          echo "Reconstructed HTML SHA-256: ${actual_sha}"
          echo "Reconstructed HTML size: $(wc -c < /tmp/SummerVerse-AI-demo.html) bytes"
          test "${actual_sha}" = "fefbd4cd542c80eb4f84fdf7c3987c5f9de93bd93ad149b498bbf570cea770b8"
          grep -q "SummerVerse AI" /tmp/SummerVerse-AI-demo.html
          grep -q "</html>" /tmp/SummerVerse-AI-demo.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload SummerVerse site
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./summerverse-ai-demo"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
