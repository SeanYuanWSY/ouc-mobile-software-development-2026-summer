name: Deploy SummerVerse AI

on:
  push:
    branches:
      - main
    paths:
      - "summerverse-ai-demo/**"
      - ".github/workflows/deploy-summerverse.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload SummerVerse site
        uses: actions/upload-pages-artifact@v3
        with:
          path: summerverse-ai-demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
