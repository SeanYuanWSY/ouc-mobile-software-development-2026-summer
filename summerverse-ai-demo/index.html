<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6b63ff" />
  <title>SummerVerse AI 正在发布</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;background:radial-gradient(circle at 50% 42%,#684fd1 0,#262252 35%,#0f1028 70%,#080916 100%);overflow:hidden}.stars,.stars:before,.stars:after{position:fixed;inset:0;content:"";background-image:radial-gradient(#fff 1px,transparent 1px);background-size:43px 43px;opacity:.35}.stars:before{transform:translate(17px,13px);background-size:67px 67px;opacity:.28}.card{position:relative;width:min(680px,calc(100vw - 36px));padding:64px 40px;text-align:center;border:1px solid rgba(255,255,255,.18);border-radius:32px;background:rgba(255,255,255,.09);box-shadow:0 30px 100px rgba(0,0,0,.35);backdrop-filter:blur(18px)}.planet{width:120px;height:120px;margin:0 auto 28px;border-radius:50%;background:linear-gradient(145deg,#ffcb87,#f4869b 46%,#7768f7);box-shadow:0 0 70px rgba(148,111,255,.7);animation:pulse 2.4s ease-in-out infinite}.ring{position:absolute;left:50%;top:95px;width:195px;height:58px;border:3px solid rgba(255,255,255,.65);border-radius:50%;transform:translateX(-50%) rotate(-13deg)}h1{margin:0;font-size:clamp(32px,6vw,58px);letter-spacing:-2px}p{margin:18px auto 0;max-width:520px;color:rgba(255,255,255,.72);font-size:17px;line-height:1.8}.status{display:inline-flex;align-items:center;gap:10px;margin-top:30px;padding:11px 18px;border-radius:999px;background:rgba(116,255,215,.12);color:#a7ffe6}.dot{width:9px;height:9px;border-radius:50%;background:#74ffd7;box-shadow:0 0 18px #74ffd7;animation:blink 1s infinite}@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 100px rgba(148,111,255,.9)}}@keyframes blink{50%{opacity:.3}}
  </style>
</head>
<body><div class="stars"></div><main class="card"><div class="planet"></div><div class="ring"></div><h1>SummerVerse AI</h1><p>“暑假数字分身”完整高保真体验正在自动发布。发布通道验证完成后，这里会替换为可交互的正式版本。</p><div class="status"><span class="dot"></span>GitHub Pages 部署测试中</div></main></body>
</html>
