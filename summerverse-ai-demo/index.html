<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b23"><meta name="description" content="SummerVerse AI｜让暑假里的自己活下来"><title>SummerVerse AI｜唤醒 SummerTwin</title><style>
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100dvh;display:grid;place-items:center;overflow:hidden;color:#faf9ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% 38%,#5d4ab5 0,transparent 29rem),radial-gradient(circle at 15% 80%,rgba(40,184,200,.16),transparent 28rem),radial-gradient(circle at 86% 76%,rgba(239,91,170,.14),transparent 26rem),#090a1c}body:before,body:after{content:"";position:fixed;inset:-10%;pointer-events:none;background-image:radial-gradient(#fff 0 1px,transparent 1.4px),radial-gradient(#a99cff 0 1px,transparent 1.5px);background-position:0 0,19px 27px;background-size:67px 67px,103px 103px;opacity:.22;animation:d 25s linear infinite}body:after{opacity:.1;transform:scale(1.3) rotate(12deg);animation-direction:reverse}.box{position:relative;width:min(620px,calc(100vw - 32px));padding:clamp(38px,7vw,62px) clamp(24px,6vw,54px);text-align:center;border:1px solid rgba(255,255,255,.15);border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.045));box-shadow:0 34px 110px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.12);backdrop-filter:blur(22px)}.orbit{position:relative;width:154px;height:154px;margin:0 auto 28px;display:grid;place-items:center}.planet{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 32% 27%,rgba(255,255,255,.88),transparent 12%),linear-gradient(145deg,#ffd39e,#fa8ba7 43%,#8974ff);box-shadow:0 0 38px rgba(255,151,187,.5),0 0 92px rgba(129,116,255,.56);animation:b 2.7s ease-in-out infinite}.orbit:before{content:"";position:absolute;inset:43px -12px;border:2px solid rgba(232,228,255,.68);border-radius:50%;transform:rotate(-15deg)}.orbit:after{content:"";position:absolute;width:10px;height:10px;left:9px;top:42px;border-radius:50%;background:#79f7e2;box-shadow:0 0 18px #79f7e2;animation:o 2.7s linear infinite;transform-origin:68px 34px}h1{margin:0;font-size:clamp(35px,8vw,56px);line-height:1;letter-spacing:-.045em;background:linear-gradient(90deg,#fff,#d9d3ff 48%,#ffb8d7);background-clip:text;color:transparent}p{margin:17px auto 0;max-width:500px;color:rgba(239,237,255,.67);font-size:clamp(14px,3.6vw,17px);line-height:1.8}.row{display:flex;justify-content:space-between;gap:14px;margin-top:32px;font-size:13px;color:rgba(247,245,255,.88)}.state{display:flex;align-items:center;gap:9px;text-align:left}.dot{width:9px;height:9px;border-radius:50%;background:#79f7e2;box-shadow:0 0 17px #79f7e2;animation:p 1.1s ease-in-out infinite}.pct{color:#c9c2ff;font-variant-numeric:tabular-nums}.track{height:5px;margin-top:12px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.08)}.bar{width:4%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#8174ff,#ff82bd,#79f7e2);transition:width .28s ease}.note{margin-top:18px;color:rgba(226,223,244,.42);font-size:12px}.retry{margin-top:24px;padding:12px 22px;border:1px solid rgba(255,255,255,.18);border-radius:999px;color:#fff;background:linear-gradient(105deg,#7164f4,#b567dd);font:inherit;font-weight:700;cursor:pointer}@keyframes d{to{transform:translate(67px,67px)}}@keyframes b{50%{transform:scale(1.055)}}@keyframes o{to{transform:rotate(345deg)}}@keyframes p{50%{opacity:.3}}@media(max-width:520px){.box{border-radius:28px}.orbit{transform:scale(.88);margin-bottom:17px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="box" id="box" aria-live="polite"><div class="orbit"><div class="planet"></div></div><h1>SummerVerse AI</h1><p>正在重建你的暑假宇宙，让“暑假里的你”重新苏醒。</p><div class="row"><span class="state"><i class="dot"></i><span id="state">正在连接记忆星图</span></span><span class="pct" id="pct">4%</span></div><div class="track"><div class="bar" id="bar"></div></div><div class="note">首次加载通常需要几秒；之后可直接进入完整交互原型。</div></main><script>
(()=>{const box=document.querySelector('#box'),state=document.querySelector('#state'),pct=document.querySelector('#pct'),bar=document.querySelector('#bar');const set=(n,s)=>{n=Math.max(4,Math.min(100,Math.round(n)));state.textContent=s;pct.textContent=n+'%';bar.style.width=n+'%'};const fail=e=>{console.error('[SummerVerse]',e);box.innerHTML='<div class="orbit"><div class="planet"></div></div><h1 style="font-size:30px">记忆宇宙暂时没有响应</h1><p>'+String(e?.message||e)+'</p><button class="retry" onclick="location.reload()">重新唤醒 SummerTwin</button><div class="note">请使用最新版 Chrome、Edge 或 Safari，并确认网络连接正常。</div>'};(async()=>{try{if(!('DecompressionStream'in window))throw Error('当前浏览器版本不支持网页解压，请升级后重试。');const chunks=[];for(let i=0;i<12;i++){set(8+(i+1)/12*64,`正在载入记忆分片 ${i+1} / 12`);const r=await fetch(`./data/${String(i).padStart(2,'0')}.txt`,{cache:'no-store'});if(!r.ok)throw Error(`记忆分片 ${i+1} 加载失败（HTTP ${r.status}）`);chunks.push((await r.text()).trim())}set(80,'正在重建人格基因');const raw=atob(chunks.join('')),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')),html=await new Response(stream).text();if(!html.includes('SummerVerse')||!html.includes('<!DOCTYPE html>'))throw Error('页面校验失败，请重新加载。');set(94,'正在连接时间分身');await new Promise(r=>setTimeout(r,180));set(100,'SummerTwin 已苏醒');await new Promise(r=>setTimeout(r,250));document.open();document.write(html);document.close()}catch(e){fail(e)}})()})();
</script></body></html>
