<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11112b">
<meta name="description" content="SummerVerse AI｜让暑假里的自己活下来">
<title>SummerVerse AI｜唤醒 SummerTwin</title>
<style>
:root{color-scheme:dark;--ink:#f8f7ff;--muted:rgba(232,229,255,.68);--violet:#8e7bff;--pink:#f193c6;--mint:#7cf6dc}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100dvh;display:grid;place-items:center;overflow:hidden;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% 38%,rgba(118,92,255,.34),transparent 28%),radial-gradient(circle at 18% 18%,rgba(241,147,198,.13),transparent 25%),radial-gradient(circle at 84% 76%,rgba(93,226,225,.12),transparent 26%),linear-gradient(160deg,#171536,#0d0e24 55%,#080914)}.sky,.sky:before,.sky:after{position:fixed;inset:0;content:"";pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.4px),radial-gradient(circle,rgba(174,155,255,.85) 0 1px,transparent 1.5px);background-position:0 0,23px 19px;background-size:73px 73px,113px 113px;opacity:.25;animation:drift 18s linear infinite}.sky:before{transform:scale(1.12) rotate(8deg);opacity:.18;animation-duration:28s}.sky:after{transform:scale(.92) rotate(-5deg);opacity:.11;animation-duration:38s}.halo{position:fixed;width:min(76vw,920px);aspect-ratio:1;border-radius:50%;background:conic-gradient(from 30deg,transparent,rgba(131,107,255,.12),transparent 34%,rgba(84,224,214,.08),transparent 72%);filter:blur(12px);animation:spin 22s linear infinite}.shell{position:relative;width:min(560px,calc(100vw - 32px));padding:clamp(34px,6vw,58px) clamp(24px,6vw,52px) 36px;text-align:center;border:1px solid rgba(255,255,255,.13);border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.045));box-shadow:0 36px 120px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(24px) saturate(135%);-webkit-backdrop-filter:blur(24px) saturate(135%)}.mark{position:relative;width:132px;height:132px;margin:0 auto 28px;display:grid;place-items:center}.planet{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fff2cf 0 7%,transparent 8%),radial-gradient(circle at 28% 25%,#ffdca5,#f6a79f 42%,#8d72ff);box-shadow:0 0 26px rgba(255,184,160,.52),0 0 76px rgba(125,92,255,.68);animation:breathe 2.6s ease-in-out infinite}.ring{position:absolute;width:132px;height:43px;border:2px solid rgba(248,247,255,.76);border-radius:50%;transform:rotate(-14deg)}.satellite{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--mint);box-shadow:0 0 18px var(--mint);animation:orbit 3.8s linear infinite}h1{margin:0;font-size:clamp(34px,9vw,53px);line-height:1;letter-spacing:-2.2px;font-weight:780}.tagline{margin:14px 0 0;font-size:17px;font-weight:650;color:#ddd8ff}.copy{margin:10px auto 0;max-width:410px;color:var(--muted);font-size:14px;line-height:1.7}.progress-wrap{margin-top:30px}.progress{height:7px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.095);box-shadow:inset 0 1px 2px rgba(0,0,0,.28)}.progress span{display:block;width:4%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--pink),var(--mint));box-shadow:0 0 18px rgba(143,122,255,.76);transition:width .42s cubic-bezier(.22,.8,.28,1)}.status-row{min-height:24px;margin-top:14px;display:flex;justify-content:center;align-items:center;gap:9px;color:rgba(237,235,255,.78);font-size:13px}.pulse{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 14px rgba(124,246,220,.9);animation:blink 1.15s ease-in-out infinite}.facts{margin-top:24px;padding-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid rgba(255,255,255,.09)}.fact strong{display:block;font-size:15px}.fact span{display:block;margin-top:5px;color:rgba(231,228,255,.5);font-size:11px}button{margin-top:18px;padding:11px 20px;border:0;border-radius:999px;color:#17142f;font-weight:700;background:#f7f5ff;cursor:pointer}button[hidden]{display:none}.error .pulse{background:#ff8eaa;box-shadow:0 0 14px rgba(255,142,170,.9)}@keyframes drift{to{background-position:73px 73px,-90px 132px}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{transform:scale(1.07);box-shadow:0 0 34px rgba(255,184,160,.58),0 0 94px rgba(125,92,255,.78)}}@keyframes orbit{from{transform:rotate(0) translateX(65px) rotate(0)}to{transform:rotate(360deg) translateX(65px) rotate(-360deg)}}@keyframes blink{50%{opacity:.3;transform:scale(.72)}}@media(max-width:520px){.shell{border-radius:28px}.mark{margin-bottom:22px;transform:scale(.9)}.facts{gap:4px}.fact strong{font-size:13px}.copy{font-size:13px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="sky"></div><div class="halo" aria-hidden="true"></div>
<main class="shell" aria-live="polite">
<div class="mark" aria-hidden="true"><div class="ring"></div><div class="planet"></div><div class="satellite"></div></div>
<h1>SummerVerse AI</h1><p class="tagline">正在唤醒你的暑假数字分身</p><p class="copy">同步照片、心情、地点与成长轨迹，让这个夏天里的你继续活下来。</p>
<div class="progress-wrap"><div class="progress" role="progressbar" aria-label="载入进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4"><span></span></div><div class="status-row"><i class="pulse" aria-hidden="true"></i><span id="status">正在连接记忆宇宙…</span></div></div>
<div class="facts" aria-hidden="true"><div class="fact"><strong>36</strong><span>时间分身</span></div><div class="fact"><strong>128</strong><span>记忆节点</span></div><div class="fact"><strong>AI Agent</strong><span>一句话行动</span></div></div>
<button id="retry" hidden type="button">重新尝试</button>
</main>
<script>
(()=>{const count=12,bar=document.querySelector('.progress span'),progress=document.querySelector('.progress'),status=document.querySelector('#status'),retry=document.querySelector('#retry'),shell=document.querySelector('.shell');const setProgress=(value,label)=>{bar.style.width=`${value}%`;progress.setAttribute('aria-valuenow',String(value));if(label)status.textContent=label};const boot=async()=>{retry.hidden=true;shell.classList.remove('error');const pieces=[];try{for(let index=1;index<=count;index++){const name=String(index).padStart(2,'0'),response=await fetch(`./payload/${name}.txt`,{cache:'no-store'});if(!response.ok)throw new Error(`记忆分片 ${name} 载入失败`);pieces.push((await response.text()).trim());setProgress(Math.round(6+index/count*72),`正在同步暑假记忆 ${index}/${count}`)}if(!('DecompressionStream'in window))throw new Error('浏览器版本过旧，请使用最新版 Chrome、Edge 或 Safari');setProgress(86,'正在构建人格基因…');const binary=atob(pieces.join('')),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')),html=await new Response(stream).text();if(!html.includes('SummerVerse AI')||!html.includes('</html>'))throw new Error('记忆宇宙校验失败');setProgress(100,'SummerTwin 已苏醒');setTimeout(()=>{document.open();document.write(html);document.close()},360)}catch(error){console.error(error);shell.classList.add('error');status.textContent=`载入失败：${error.message}`;retry.hidden=false}};retry.addEventListener('click',boot);boot()})();
</script>
</body>
</html>
