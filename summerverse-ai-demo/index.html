<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6b63ff" />
  <meta name="description" content="SummerVerse AI｜让暑假里的自己活下来" />
  <title>SummerVerse AI｜正在唤醒数字分身</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b0b21;color:#fff}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 44%,#6250bc 0,#25234e 34%,#11122d 68%,#080916 100%)}.stars,.stars:before,.stars:after{position:fixed;inset:0;content:"";pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:43px 43px;opacity:.25}.stars:before{transform:translate(17px,13px);background-size:67px 67px;opacity:.22}.card{position:relative;width:min(650px,calc(100vw - 36px));padding:62px 38px;text-align:center;border:1px solid rgba(255,255,255,.17);border-radius:32px;background:rgba(255,255,255,.075);box-shadow:0 30px 100px rgba(0,0,0,.36);backdrop-filter:blur(18px)}.planet{width:112px;height:112px;margin:0 auto 28px;border-radius:50%;background:linear-gradient(145deg,#ffd18b,#f48ca8 48%,#7869fb);box-shadow:0 0 72px rgba(147,113,255,.7);animation:pulse 2.2s ease-in-out infinite}.ring{position:absolute;left:50%;top:94px;width:186px;height:55px;border:3px solid rgba(255,255,255,.67);border-radius:50%;transform:translateX(-50%) rotate(-13deg)}h1{margin:0;font-size:clamp(31px,6vw,54px);letter-spacing:-1.8px}p{margin:17px auto 0;max-width:500px;color:rgba(255,255,255,.7);font-size:16px;line-height:1.75}.status{display:inline-flex;align-items:center;gap:10px;margin-top:28px;padding:10px 17px;border-radius:999px;background:rgba(116,255,215,.11);color:#adffe8;font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:#74ffd7;box-shadow:0 0 18px #74ffd7;animation:blink 1s infinite}.error{display:none;margin-top:22px;color:#ffd1da;line-height:1.6}@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 100px rgba(148,111,255,.88)}}@keyframes blink{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="stars"></div>
  <main class="card">
    <div class="planet"></div><div class="ring"></div>
    <h1>SummerVerse AI</h1>
    <p>正在载入记忆、人格基因与时间分身，马上进入完整的暑假数字宇宙。</p>
    <div class="status"><span class="dot"></span><span id="statusText">载入数字分身 · 0%</span></div>
    <div class="error" id="errorBox">当前浏览器无法载入体验包。请使用最新版 Chrome、Edge 或 Safari，并确认网络连接正常。</div>
  </main>
  <script>
  (async()=>{
    const parts=Array.from({length:10},(_,i)=>`./bundle/part-${String(i+1).padStart(2,'0')}.b64`);
    const status=document.getElementById('statusText');
    try{
      if(!('DecompressionStream' in window)) throw new Error('DecompressionStream unavailable');
      let encoded='';
      for(let i=0;i<parts.length;i++){
        const response=await fetch(parts[i],{cache:'no-store'});
        if(!response.ok) throw new Error(`payload ${i+1}: ${response.status}`);
        encoded+=(await response.text()).trim();
        status.textContent=`载入数字分身 · ${Math.round((i+1)/parts.length*78)}%`;
      }
      const raw=atob(encoded);
      const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      if(!html.includes('SummerVerse')) throw new Error('页面校验失败');
      status.textContent='数字分身苏醒 · 100%';
      await new Promise(resolve=>setTimeout(resolve,260));
      document.open();document.write(html);document.close();
    }catch(error){
      console.error(error);
      document.querySelector('.status').style.display='none';
      document.getElementById('errorBox').style.display='block';
    }
  })();
  </script>
</body>
</html>
